name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify frontend version artifact
        run: |
          node -e "const v=require('./frontend/dist/version.json'); if(!/^[a-f0-9]{40}$/i.test(v.commit)||!Number.isFinite(Date.parse(v.builtAt))) process.exit(1)"
      - name: Show formatting diff on failure
        if: failure()
        run: |
          npm run format
          git diff --exit-code
