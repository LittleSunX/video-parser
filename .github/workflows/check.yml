name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify frontend version artifact
        run: |
          node -e "const v=require('./frontend/dist/version.json'); if(!/^[a-f0-9]{40}$/i.test(v.commit)||!Number.isFinite(Date.parse(v.builtAt))) process.exit(1)"
      - name: Verify standalone Node version artifact
        run: |
          node -e "const v=require('./server/dist/version.json'); if(v.runtime!=='node'||!/^[a-f0-9]{40}$/i.test(v.tag)||!/^[a-f0-9-]{36}$/i.test(v.id)||!Number.isFinite(Date.parse(v.timestamp))) process.exit(1)"
      - name: Show formatting diff on failure
        if: failure()
        run: |
          npm run format
          git diff --exit-code

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Linux integration tools
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Exercise the deployment template with real Nginx and Node
        run: npm run check:nginx
