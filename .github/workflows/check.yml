name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify frontend version artifact
        run: |
          node -e "const v=require('./frontend/dist/version.json'); if(!/^[a-f0-9]{40}$/i.test(v.commit)||!Number.isFinite(Date.parse(v.builtAt))) process.exit(1)"
      - name: Verify standalone Node version artifact
        run: |
          node -e "const v=require('./server/dist/version.json'); if(v.runtime!=='node'||!/^[a-f0-9]{40}$/i.test(v.tag)||!/^[a-f0-9-]{36}$/i.test(v.id)||!Number.isFinite(Date.parse(v.timestamp))) process.exit(1)"
      - name: Show formatting diff on failure
        if: failure()
        run: |
          npm run format
          git diff --exit-code

  nginx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate monitoring service and timer
        run: |
          # The VPS template uses the system Node path; hosted runners may only provide a tool-cache path.
          if [ ! -e /usr/bin/node ]; then sudo ln -s "$(command -v node)" /usr/bin/node; fi
          systemd-analyze verify deploy/video-parser-monitor.service deploy/video-parser-monitor.timer
      - name: Verify monitoring with a private config and real systemd
        run: sudo "$(command -v node)" scripts/check-monitoring-systemd.mjs
      - name: Install Linux integration tools
        run: sudo apt-get update && sudo apt-get install -y nginx openssl
      - name: Exercise the deployment template with real Nginx and Node
        run: npm run check:nginx

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 7
