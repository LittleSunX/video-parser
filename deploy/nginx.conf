# 安装为 /etc/nginx/conf.d/video-parser.conf，由主配置的 http {} include。
# 不是完整 nginx.conf；仅用于同机 Nginx -> loopback Node 的单实例部署。
# 先替换 example.com 并取得证书，再 nginx -t；详见 VPS_DEPLOY.md。
# 专用 VPS：先禁用发行版默认站点，避免重复 default_server。

# 日志只含方法、无 query 的 URI、状态、时间、字节数和请求编号。
# 禁止添加原始请求行、query、Referer、请求体、媒体地址或 errorToken。
map $upstream_http_x_request_id $video_parser_request_id {
    ""      $request_id;
    default $upstream_http_x_request_id;
}
log_format video_parser_safe escape=json
    '{"method":"$request_method","uri":"$uri","status":$status,'
    '"time":"$time_iso8601","duration":$request_time,"bytes":$body_bytes_sent,'
    '"request_id":"$video_parser_request_id"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name example.com;

    access_log /var/log/nginx/video-parser.access.log video_parser_safe;
    # error_log 也可能写完整 URL；禁止持久化，不能临时开启 raw/debug。
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_timeout 15s;
    send_timeout 45s;

    # 仅重定向目标保留原 URI/query；绝不把它写进日志。
    return 308 https://example.com$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/video-parser/current/frontend;
    index index.html;

    access_log /var/log/nginx/video-parser.access.log video_parser_safe;
    error_log /dev/null crit;
    client_max_body_size 64k;
    client_body_timeout 15s;
    send_timeout 45s;
    gzip off;

    # /api 不得进入 SPA fallback；不拦截或改写应用的错误响应。
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "identity";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_ignore_client_abort off;
        proxy_intercept_errors off;
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
    }

    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
