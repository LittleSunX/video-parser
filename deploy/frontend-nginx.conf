# 仅托管前端，浏览器通过构建时的 VITE_API_BASE_URL 调用原 API。
# 安装到 /etc/nginx/conf.d/video-parser-frontend.conf，由 http {} include。
# 替换所有 video.example.com；先按 guides/frontend-only.md 申请证书。
# 此文件不配置 Node 或 /api 反代，不能替代全 VPS 方案的 nginx.conf。

server {
    listen 80;
    server_name video.example.com;

    access_log off;
    error_log /dev/null crit;

    # Certbot webroot 续期需要保留 HTTP 验证目录。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / {
        return 308 https://video.example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name video.example.com;

    ssl_certificate /etc/letsencrypt/live/video.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/video-parser/current;
    index index.html;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    error_log /dev/null crit;

    # API 在原来的独立域名。地址配错时返回 404，不用 HTML 掩盖错误。
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }
    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ^~ /assets/ {
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
